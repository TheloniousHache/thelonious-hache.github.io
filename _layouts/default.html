<!DOCTYPE html>
<html lang="{{ site.lang | default: 'fr' }}">

<head>
  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>
    {% if page.title %}
      {{ page.title }} · {{ site.title }}
    {% else %}
      {{ site.title }}
    {% endif %}
  </title>

  <meta name="description" content="{{ site.description }}">

  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>

<body>

  <header class="site-header">

    <div class="site-header-inner">

      <a class="site-title" href="{{ '/' | relative_url }}">
        {{ site.title }}
      </a>

      <p class="site-description">
        {{ site.description }}
      </p>

      <nav class="site-nav">
        <a href="{{ '/' | relative_url }}">Accueil</a>
        <a href="{{ '/articles/' | relative_url }}">Articles</a>
        <a href="{{ '/about/' | relative_url }}">À propos</a>
      </nav>

    </div>

  </header>

  <main class="site-main">

    {{ content }}

  </main>

  <footer class="site-footer">
  
    <div class="footer-inner">
  
      <span>
        © {{ 'now' | date: "%Y" }} {{ site.author }}
      </span>
  
      <a
        class="linkedin-link"
        href="https://www.linkedin.com/in/thelonious-hache/"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="Profil LinkedIn de Thélonious Hache"
      >
        <svg
          class="linkedin-icon"
          xmlns="http://www.w3.org/2000/svg"
          viewBox="0 0 24 24"
          aria-hidden="true"
        >
          <path d="M20.45 20.45h-3.56v-5.57c0-1.33-.03-3.04-1.85-3.04-1.85 0-2.14 1.45-2.14 2.94v5.67H9.34V9h3.42v1.56h.05c.48-.9 1.64-1.85 3.37-1.85 3.61 0 4.28 2.37 4.28 5.46v6.28zM5.32 7.43a2.07 2.07 0 1 1 0-4.14 2.07 2.07 0 0 1 0 4.14zM3.54 20.45H7.1V9H3.54v11.45zM22.23 0H1.77C.79 0 0 .77 0 1.72v20.56C0 23.23.79 24 1.77 24h20.46c.98 0 1.77-.77 1.77-1.72V1.72C24 .77 23.21 0 22.23 0z"/>
        </svg>
  
        <span>LinkedIn</span>
      </a>
  
    </div>
  
  </footer>

</body>

</html>
