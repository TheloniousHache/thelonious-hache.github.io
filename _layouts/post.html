---
layout: default
---

<article class="post">

  <header class="post-header">

    <p class="post-date">
      {{ page.date | date: "%d/%m/%Y" }}
    </p>

    <h1>{{ page.title }}</h1>

    {% if page.subtitle %}
      <p class="post-subtitle">
        {{ page.subtitle }}
      </p>
    {% endif %}

    {% if page.categories %}
      <p class="post-categories">
        {% for category in page.categories %}
          {{ category }}{% unless forloop.last %} · {% endunless %}
        {% endfor %}
      </p>
    {% endif %}

  </header>

  <div class="post-content">

    {{ content }}

  </div>

</article>
